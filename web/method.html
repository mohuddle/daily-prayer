<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a1612">
  <meta name="description" content="Browse Matthew Henry’s Method for Prayer by head. Lookup only — not the daily sitting.">
  <title>Method index · Daily Prayer</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <script>
    (function () {
      const root = document.documentElement;
      let theme = localStorage.getItem("dp-theme") || "chapel";
      if (!["chapel", "clear", "spacegray"].includes(theme)) theme = "chapel";
      root.dataset.theme = theme;
      root.dataset.size = localStorage.getItem("dp-size") || "md";
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="masthead">
      <p class="brand">Daily Prayer</p>
      <h1>Method index</h1>
      <p class="progress">A lookup for Henry’s heads. Use <a href="./">today’s office</a> to pray.</p>
      <p>
        <input type="search" id="lookup" class="lookup" placeholder="Search heads…" aria-label="Search Method heads">
      </p>
    </header>
    <main id="catalog" class="office"></main>
    <footer class="colophon">
      <a href="./">Back to today’s office</a>.
      Family short forms and the full index stay here, not in the daily sitting.
      Matthew Henry, <cite>A Method for Prayer</cite> (1710).
    </footer>
  </div>
  <script src="js/lookup.js"></script>
</body>
</html>
